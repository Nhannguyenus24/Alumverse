name: CD

on:
  pull_request:
    types: [closed]
    branches:
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Detect what changed
  # ─────────────────────────────────────────────
  detect-changes:
    name: "Detect Changed Paths"
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─────────────────────────────────────────────
  # Deploy Frontend → Vercel
  # ─────────────────────────────────────────────
  # deploy-frontend:
  #   name: "Deploy Frontend → Vercel"
  #   needs: detect-changes
  #   if: needs.detect-changes.outputs.frontend == 'true'
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: Vercel
  #     url: ${{ steps.deploy.outputs.url }}
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '24'
  #         cache: 'npm'
  #         cache-dependency-path: frontend/package-lock.json

  #     - name: Install Vercel CLI
  #       run: npm install -g vercel@latest

  #     - name: Pull Vercel environment
  #       working-directory: frontend
  #       run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
  #       env:
  #         VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  #         VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  #     - name: Build for production
  #       working-directory: frontend
  #       run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
  #       env:
  #         VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  #         VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  #     - name: Deploy to Vercel
  #       id: deploy
  #       working-directory: frontend
  #       run: |
  #         URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
  #         echo "url=$URL" >> $GITHUB_OUTPUT
  #         echo "✅ Frontend deployed: $URL"
  #       env:
  #         VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  #         VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─────────────────────────────────────────────
  # Deploy Backend → Render
  # ─────────────────────────────────────────────
  deploy-backend:
    name: "Deploy Backend → Render"
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: Render
    steps:
      - name: Trigger Render deploy hook
        run: |
          echo "::group::Triggering Render deploy..."
          RESPONSE=$(curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "::endgroup::"
          echo "✅ Render deploy triggered."
          echo "$RESPONSE"

      - name: Wait for Render deploy to complete
        run: |
          echo "Waiting for service to come up..."
          MAX_ATTEMPTS=20
          ATTEMPT=0
          until curl -sf "${{ secrets.RENDER_SERVICE_URL }}/health" > /dev/null 2>&1; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error title=Deploy Timeout::Health check failed after $((MAX_ATTEMPTS * 15)) seconds."
              exit 1
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — retrying in 15s..."
            sleep 15
          done
          echo "✅ Backend is healthy at ${{ secrets.RENDER_SERVICE_URL }}/health"
