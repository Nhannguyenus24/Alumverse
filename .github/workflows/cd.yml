  # ─────────────────────────────────────────────
  # Deploy Backend → DigitalOcean Droplet
  # ─────────────────────────────────────────────
  deploy-backend:
    name: "Deploy Backend → DigitalOcean Droplet"
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17' 
          distribution: 'temurin'
          cache: 'maven'
      - name: Build Backend JAR
        working-directory: backend
        run: ./mvnw clean package -DskipTests
      - name: Copy JAR to Droplet via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "backend/target/*.jar"
          target: "/var/www/backend/"
          strip_components: 2
      - name: Restart Backend Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            mv /var/www/backend/*.jar /var/www/backend/app.jar
            systemctl restart backend
            systemctl status backend --no-pager