groups:
  - name: endpoint_latency_alerts
    interval: 30s
    rules:
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99, sum(rate(http_endpoint_latency_seconds_bucket[5m])) by (le, path)) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High P99 latency on {{ $labels.path }}"
          description: |
            P99 latency for {{ $labels.path }} is {{ $value | humanizeDuration }},
            which exceeds 1 second threshold.

      - alert: HighAverageLatency
        expr: |
          sum by (path) (rate(http_endpoint_latency_seconds_sum[5m])) /
          sum by (path) (rate(http_endpoint_latency_seconds_count[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High average latency on {{ $labels.path }}"
          description: |
            Average latency for {{ $labels.path }} is {{ $value | humanizeDuration }},
            which exceeds 500ms threshold.

  - name: endpoint_error_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          (sum(http_endpoint_errors_total) / sum(http_endpoint_requests_total)) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: |
            Overall API error rate is {{ $value | humanizePercentage }},
            which exceeds 1% threshold.

      - alert: HighErrorRateByEndpoint
        expr: |
          (sum by (path) (rate(http_endpoint_errors_total[5m])) /
           sum by (path) (rate(http_endpoint_requests_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.path }}"
          description: |
            Error rate for {{ $labels.path }} is {{ $value | humanizePercentage }},
            which exceeds 5% threshold.

      - alert: ZeroTraffic
        expr: |
          sum(rate(http_endpoint_requests_total[5m])) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No API traffic detected"
          description: |
            Backend API is receiving no traffic.
            This might indicate a connectivity issue.

  - name: system_resource_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: |
          system_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: |
            System CPU usage is {{ $value | humanizePercentage }},
            which exceeds 80% threshold.

      - alert: HighHeapMemoryUsage
        expr: |
          (sum(jvm_memory_used_bytes{area="heap"}) /
           sum(jvm_memory_max_bytes{area="heap"})) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical JVM heap memory usage"
          description: |
            JVM heap memory usage is {{ $value | humanizePercentage }},
            which exceeds 90% threshold. Risk of OutOfMemoryError.

      - alert: HighGCPauseTime
        expr: |
          rate(jvm_gc_pause_seconds_sum[5m]) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High garbage collection pause time"
          description: |
            GC pause time rate is {{ $value | humanizeDuration }}/sec

  - name: endpoint_latency_recording_rules
    interval: 30s
    rules:
      - record: endpoint:latency:p50
        expr: |
          histogram_quantile(0.50, sum(rate(http_endpoint_latency_seconds_bucket[5m])) by (le, path, method))

      - record: endpoint:latency:p95
        expr: |
          histogram_quantile(0.95, sum(rate(http_endpoint_latency_seconds_bucket[5m])) by (le, path, method))

      - record: endpoint:latency:p99
        expr: |
          histogram_quantile(0.99, sum(rate(http_endpoint_latency_seconds_bucket[5m])) by (le, path, method))

      - record: endpoint:latency:avg
        expr: |
          sum by (path, method) (rate(http_endpoint_latency_seconds_sum[5m])) /
          sum by (path, method) (rate(http_endpoint_latency_seconds_count[5m]))

      - record: endpoint:requests:rate
        expr: |
          sum by (path, method, status) (rate(http_endpoint_requests_total[5m]))

      - record: endpoint:errors:rate
        expr: |
          sum by (path, method, status) (rate(http_endpoint_errors_total[5m]))

      - record: endpoint:error_ratio
        expr: |
          sum by (path, method) (rate(http_endpoint_errors_total[5m])) /
          sum by (path, method) (rate(http_endpoint_requests_total[5m]))
