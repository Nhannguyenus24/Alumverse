  - name: 'performance-alerts'
    # Performance issues
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#performance'

# Inhibition rules - prevent certain alerts if others are firing
inhibit_rules:
  # Don't send warning if critical is already firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Don't send warning if endpoint has high latency
  - source_match:
      alertname: 'HighP99Latency'
    target_match:
      alertname: 'HighAverageLatency'
    equal: ['path']

# Templates for alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

