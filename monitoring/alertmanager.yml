global:
  resolve_timeout: 5m

# The root route with all parameters
route:
  # Default receiver - where alerts are sent if no other route matches
  receiver: 'default'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'instance']

  # How long to initially wait to group notifications
  group_wait: 30s

  # How long to wait after the first notification before sending new ones
  group_interval: 5m

  # How long an alert should wait before repeating
  repeat_interval: 1h

  # Sub-routes - different handling for specific alert types
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 10m

    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 1h

    - match_re:
        alertname: "High.*Latency"
      receiver: 'performance-alerts'
      group_wait: 30s
      repeat_interval: 30m

# Receivers - where to send alerts
receivers:
  - name: 'default'
    # Uncomment to enable email notifications
