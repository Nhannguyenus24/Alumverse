services:
  db:
    # PG 16 to match production (prod runs 16.14). Bumped from 15 — recreate the
    # volume when upgrading: `docker compose down -v`.
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped

    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_R2DBC_URL=r2dbc:postgresql://db:5432/db
      - SPRING_R2DBC_USERNAME=user
      - SPRING_R2DBC_PASSWORD=123
      - SPRING_FLYWAY_URL=jdbc:postgresql://db:5432/db
      - SPRING_FLYWAY_USER=user
      - SPRING_FLYWAY_PASSWORD=123
      - JWT_SECRET=your_secret_key_change_this_in_production_environment_with_minimum_256_bits
    ports:
      - "8080:8080"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./images:/images:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
