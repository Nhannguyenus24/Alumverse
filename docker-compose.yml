services:
  db:
    # PG 16 to match production (prod runs 16.14). Bumped from 15 — recreate the
    # volume when upgrading: `docker compose down -v`.
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped

    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data
      # Schema is now owned by Flyway (see backend/src/main/resources/db/migration).
      # A fresh empty DB gets its schema from Flyway V1 on backend startup.
      # Dev seed/test data (docs/sample.sql) is loaded manually — see docs/plan_flyway_migration.md.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./images:/images:ro
      - ./ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

volumes:
  db_data:
