name: datn
description: "HCMUS Alumni Mobile App - DATN"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  pretty_dio_logger: ^1.4.0
  web_socket_channel: ^3.0.1

  # JWT
  jwt_decoder: ^2.0.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Model & serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Auth
  google_sign_in: ^6.2.2

  # UI helpers
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Forms / validation
  formz: ^0.7.0

  # i18n
  easy_localization: ^3.0.7

  # Utils
  intl: ^0.19.0
  logger: ^2.5.0
  equatable: ^2.0.7
  url_launcher: ^6.3.1

  # Chat emoji picker
  emoji_picker_flutter: ^3.1.0

  # Rich text & images
  #flutter_quill: ^11.5.1
  image_picker: ^1.1.2

  # Render ReactQuill HTML article bodies (no WebView)
  flutter_widget_from_html_core: ^0.16.0

  # Charts (cho dashboard sau này)
  fl_chart: ^0.69.2
  path_provider: 2.1.5

  # QR vé sự kiện — render hoàn toàn trên client (tự host, không qua bên thứ 3)
  qr_flutter: ^4.1.0

  # Quét QR vé khi admin/staff check-in tại sự kiện (camera, xử lý on-device)
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/images/app_icon_android.png"
  image_path_ios: "assets/images/app_icon_ios.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_android.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fitbot/
    - assets/translations/
