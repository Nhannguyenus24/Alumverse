name: datn
description: "HCMUS Alumni Mobile App - DATN"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  web_socket_channel: ^3.0.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Model & serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Auth
  google_sign_in: ^6.2.2

  # UI helpers
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Forms / validation
  formz: ^0.7.0

  # Utils
  intl: ^0.19.0
  logger: ^2.5.0
  equatable: ^2.0.7
  url_launcher: ^6.3.1

  # Rich text & images
  flutter_quill: ^10.8.5
  image_picker: ^1.1.2

  # Charts (cho dashboard sau này)
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
