spring:
  application:
    name: alumniverse-backend

  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true # bật connection pooling
      initial-size: 5 
      max-size: 20 
      max-idle-time: 30m

  data:
    r2dbc:
      repositories:
        enabled: true # cho phép dùng các repository với các hàm save, delete có sẵn

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.service.backend: DEBUG
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql: DEBUG

