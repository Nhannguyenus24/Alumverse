user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml
               image/webp;
    gzip_disable "msie6";

    upstream backend {
        server localhost:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ====================================================
        # 1. Phục vụ ảnh tĩnh từ thư mục /uploads/
        # URL: http://localhost/uploads/uuid.webp
        # ====================================================
        location /images/ {
            alias /images/;
            
            # Cấu hình cache browser: lưu ảnh trong 30 ngày
            expires 30d;
            add_header Cache-Control "public, immutable";
            
            # Cho phép CORS nếu cần cross-origin access
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            
            # Log không cần thiết để tiết kiệm
            access_log off;
            
            # Cấp phép truy cập file (nếu được yêu cầu)
            allow all;
        }

        # ====================================================
        # 2. Proxy tất cả API requests đến Spring Boot Backend
        # URL: http://localhost/api/* -> http://backend:8080/api/*
        # ====================================================
        location /api/ {
            proxy_pass http://localhost:8080;
            
            # Headers để Spring Boot nhận đúng thông tin từ client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers cho WebFlux (Spring Boot dùng WebFlux)
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            
            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # ====================================================
        # 3. Swagger UI & API Documentation
        # URL: http://localhost/swagger-ui.html
        # ====================================================
        location /swagger-ui.html {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ====================================================
        # 4. Health check endpoint
        # ====================================================
        location /health {
            proxy_pass http://localhost:8080;
            access_log off;
        }

        # ====================================================
        # 5. Default root path - nếu cấu hình frontend tĩnh
        # ====================================================
        location / {
            # Nếu có frontend static files, proxy đến đây
            # Hoặc redirect đến frontend URL khác
            return 301 /swagger-ui.html;
        }

        # ====================================================
        # 6. Deny access to sensitive files
        # ====================================================
        location ~ /\. {
            return 403;
        }

        location ~ ~$ {
            return 403;
        }
    }
}
