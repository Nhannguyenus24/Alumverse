# docker-compose.deploy.yml
# Dùng khi database đã được deploy ở nơi khác (external DB)
# Chỉ deploy: backend + nginx

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped

    expose:
      - "8080"

    networks:
      - app_net

    # Giới hạn RAM để tránh OOM trên server nhỏ
    mem_limit: 768m
    mem_reservation: 512m

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./images:/images:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

    depends_on:
      - backend

    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  certbot_www:
  certbot_conf:
