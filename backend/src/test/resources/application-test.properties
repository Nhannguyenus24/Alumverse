# Layered on top of the main application.properties (profile-specific files add to,
# rather than replace, the base config). BackendApplicationTests boots a real
# ApplicationContext; Flyway's JDBC connection would otherwise fail wherever no
# Postgres is reachable at 127.0.0.1:5432 (e.g. CI runners without the db service
# container, or a dev machine without docker compose up).
spring.flyway.enabled=false
