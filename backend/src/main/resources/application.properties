# Caching Configuration for Bucket4j with Caffeine
# maximumSize bounds the cache so entries are evicted by LRU as well as by TTL —
# without it the cache is capped only by the 15m write-expiry and can grow unbounded.
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=15m,maximumSize=10000

# Spring Security default user configuration
spring.security.user.name=admin
spring.security.user.password=admin@123456
sepay.api-key={SEPAY_API_KEY}
sepay.img.qr.url=https://img.vietqr.io/image/
# VietQR Quick Link template: qr_only | compact | compact2 | print
sepay.img.qr.template=compact2

# Image Upload Configuration
image.upload.dir=../images/
image.domain=http://localhost/images/

# Firebase Cloud Messaging (push notifications).
# Path to the service-account JSON. Leave blank to disable push (app still boots).
