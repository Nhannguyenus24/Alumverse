# Increase WebFlux codec buffer for Base64 image/video payloads
spring.codec.max-in-memory-size=50MB

# Disable default resource handling to prevent ResourceHandler from catching /actuator paths
spring.web.resources.add-mappings=false

# Actuator & Prometheus Configuration
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.99,0.95

# Alumni verification expiry cron schedule (default: 2:30 AM daily)
alumni.verification.expiry.enabled=true
alumni.verification.expiry.cron=0 30 2 * * *
alumni.verification.expiry-days=3

# Forum post AI tagging cron schedule
forum.post.tag.enabled=true
forum.post.tag.cron=0 0 3 * * *
forum.post.tag.interval.hours=24
gemini.tagging.enabled=true
gemini.tagging.max-posts-per-run=100
