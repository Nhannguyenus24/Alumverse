# Flyway schema migrations (JDBC — Flyway does not support R2DBC).
# Uses its own standalone JDBC datasource; the app runtime stays on r2dbc above.
# baseline-on-migrate lets Flyway adopt an existing, already-populated database:
# on first run it records baseline V1 as applied WITHOUT executing it, then runs V2+.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://168.144.42.193:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=Ihr598lB54WkwP
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline from prod schema

