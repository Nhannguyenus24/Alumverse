firebase.enabled=true


# OCR giấy tờ xác minh: model vision đọc thẳng ảnh (không có Tesseract fallback).
# Key + base URL lấy từ provider đang bật trong bảng ai_providers, chỉ model là ép riêng ở đây
# vì model mặc định của chain có thể chỉ xử lý text. Model đặt ở đây bắt buộc phải đọc được ảnh.
ocr.vision.enabled=true
ocr.vision.model=google/gemma-4-26b-a4b-it:free

