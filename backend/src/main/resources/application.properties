server.port=8080
spring.application.name=Alumniverse Backend
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]

logging.level.root=INFO
logging.level.com.service.backend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.r2dbc.url=r2dbc:postgresql://168.144.42.193:5432/postgres
spring.r2dbc.username=postgres
spring.r2dbc.password=${DB_PASSWORD}
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-acquire-time=3s
spring.r2dbc.pool.max-create-connection-time=2s
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=30

jwt.secret=your_secret_key_change_this_in_production_environment_with_minimum_256_bits
jwt.expiration_access=900000
jwt.expiration_refresh=604800000
google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.recaptcha.secret-key=${GOOGLE_RECAPTCHA_SECRET}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nn5724735@gmail.com
spring.mail.password=bvvqflluvxwzxckc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from-address=nn5724735@gmail.com
app.mail.from-name=Alumniverse

# Caching Configuration for Bucket4j with Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=15m

# Spring Security default user configuration
spring.security.user.name=admin
spring.security.user.password=${SECURITY_USER_PASSWORD}
sepay.api-key={SEPAY_API_KEY}
sepay.img.qr.url=https://img.vietqr.io/image/
# VietQR Quick Link template: qr_only | compact | compact2 | print
sepay.img.qr.template=compact2

# Image Upload Configuration
image.upload.dir=../images/
image.domain=http://localhost/images/


# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
# Gemini model configuration (overridable via environment variables)
gemini.model.name=gemini-2.0-flash
gemini.model.temperature=0.0

# Forum notification cron schedule (default: every 12 hours)
forum.notification.cron=0 0 */12 * * *

mentorship.join.early-minutes=15
mentorship.session.status.cron=0 */15 * * * *

# Increase WebFlux codec buffer for Base64 image payloads
spring.codec.max-in-memory-size=20MB

# Actuator & Prometheus Configuration
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.99,0.95

# Forum post AI tagging cron schedule
forum.post.tag.cron=0 0 3 * * *
forum.post.tag.interval.hours=24
gemini.tagging.enabled=true
gemini.tagging.max-posts-per-run=100
