# ── Database (Supabase) ───────────────────────────────────────────────────────
spring.r2dbc.url=${DB_URL}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Google OAuth ──────────────────────────────────────────────────────────────
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
google.recaptcha.secret-key=${GOOGLE_RECAPTCHA_SECRET_KEY}

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from-address=${MAIL_USERNAME}

# ── Server ────────────────────────────────────────────────────────────────────
APP_BASE_URL=${APP_BASE_URL:https://refactoring-and-enhancing-the-student.onrender.com}
app.server.url=${APP_BASE_URL}

# ── PayOS ─────────────────────────────────────────────────────────────────────
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${APP_BASE_URL}/api/payment/return
payos.cancel-url=${APP_BASE_URL}/api/payment/cancel

# ── SePay ─────────────────────────────────────────────────────────────────────
sepay.api-key=${SEPAY_API_KEY}

# ── Gemini AI ─────────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY}

# ── Image hosting ─────────────────────────────────────────────────────────────
image.domain=${APP_BASE_URL}/images/

# ── CORS ──────────────────────────────────────────────────────────────────────
# Covers all Vercel preview + production deployments for this project.
# Add more comma-separated patterns if the production domain changes.
app.cors.allowed-origin-patterns=https://refactoring-and-enhancing-the-stude.vercel.app,https://refactoring-and-enhancing-the-stude-*.vercel.app,https://*-hcmus-alumni.vercel.app

# ── Logging (less verbose in prod) ───────────────────────────────────────────
logging.level.root=WARN
logging.level.com.service.backend=INFO
logging.file.name=

# Forum notification cron schedule (default: every 12 hours)
forum.notification.cron=0 0 */12 * * *