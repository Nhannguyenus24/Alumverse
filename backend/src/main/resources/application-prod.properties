# ── Database ─────────────────────────────────────────────────────────────────
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/postgres
spring.r2dbc.username=postgres
spring.r2dbc.password=Ihr598lB54WkwP
spring.r2dbc.pool.initial-size=50
spring.r2dbc.pool.max-size=100
spring.r2dbc.pool.max-idle-time=20m
spring.r2dbc.pool.max-acquire-time=5s
spring.r2dbc.pool.max-create-connection-time=3s
spring.r2dbc.pool.max-life-time=1h
spring.r2dbc.pool.validation-query=SELECT 1
spring.config.import=optional:file:.env[.properties]

# Flyway schema migrations (JDBC — Flyway does not support R2DBC).
# On the existing populated prod DB the first run records baseline V1 as applied
# WITHOUT executing it (non-destructive), then applies only V2+ going forward.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=Ihr598lB54WkwP
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline from prod schema

