# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*,https://alumverse-hcmus.vercel.app,https://alumverse-hcmus-*.vercel.app

# ── Swagger UI / OpenAPI ──────────────────────────────────────────────────────
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list

# ── Caching (Caffeine) ────────────────────────────────────────────────────────
# maximumSize bounds the cache (LRU) on top of the 15m write-expiry to prevent unbounded growth.
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=15m,maximumSize=10000

# ── WebFlux codec buffer (Base64 image/video payloads) ────────────────────────
spring.codec.max-in-memory-size=50MB

# ── Disable default resource handling to prevent ResourceHandler from catching /actuator paths ──
spring.web.resources.add-mappings=false

# ── Actuator & Prometheus ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true
management.metrics.web.server.request.autotime.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.99,0.95

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.service.backend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.file.name=/var/log/alumverse/backend/alumverse.log

# ── Cron schedules ────────────────────────────────────────────────────────────
forum.notification.enabled=true
forum.notification.cron=0 0 */12 * * *
forum.post.tag.enabled=true
forum.post.tag.cron=0 0 3 * * *
forum.post.tag.interval.hours=24
mentorship.join.early-minutes=15
mentorship.session.status.enabled=true
mentorship.session.status.cron=0 */15 * * * *
alumni.verification.expiry.enabled=true
alumni.verification.expiry.cron=0 30 2 * * *
alumni.verification.expiry-days=3

